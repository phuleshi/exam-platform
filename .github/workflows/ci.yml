name: CI Pipeline

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GITOPS_REPO: ${{ github.repository_owner }}/exam-platform-gitops
  CONFIG_FILE: k8s/backend.yaml

jobs:
  # Stage: build_dev (Build & Push Docker image to GHCR)
  build_dev:
    name: Build & Push Image (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Short SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ steps.vars.outputs.short_sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:latest

  # Stage: update_config_dev (Update GitOps repository config manifest)
  update_config_dev:
    name: Update GitOps Config Repository
    needs: [build_dev]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitOps Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN || secrets.GITHUB_TOKEN }}
          ref: main

      - name: Update Image Tag in Manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          FULL_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ needs.build_dev.outputs.short_sha }}"

          # Cập nhật tag image trong file k8s manifest bằng sed
          sed -i "s|image: ${{ env.REGISTRY }}/.*|image: ${FULL_IMAGE}|g" ${{ env.CONFIG_FILE }}

          git add ${{ env.CONFIG_FILE }}
          if ! git diff-index --quiet HEAD; then
            git commit -m "Update version ${{ needs.build_dev.outputs.short_sha }}"
            git push
          else
            echo "No changes to commit"
          fi


