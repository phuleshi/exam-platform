name: CI Pipeline

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GITOPS_REPO: ${{ github.repository_owner }}/exam-platform-gitops

jobs:
  # Stage: build_dev (Build & Push Docker images for Backend & Frontend to GHCR in parallel with GHA caching)
  build_dev:
    name: Build & Push (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    permissions:
      contents: read
      packages: write
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Short SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image (${{ matrix.service }})
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:${{ steps.vars.outputs.short_sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # Stage: update_config_dev (Update GitOps repository manifests for Backend & Frontend)
  update_config_dev:
    name: Update GitOps Config Repository
    needs: [build_dev]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitOps Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
          ref: main

      - name: Update Image Tags in Manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          SHORT_SHA="${{ needs.build_dev.outputs.short_sha }}"
          BACKEND_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${SHORT_SHA}"
          FRONTEND_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${SHORT_SHA}"

          # Cập nhật tag image trong k8s/backend.yaml
          sed -i "s|image: ${{ env.REGISTRY }}/.*/backend:.*|image: ${BACKEND_IMAGE}|g" k8s/backend.yaml

          # Cập nhật tag image trong k8s/frontend.yaml
          sed -i "s|image: ${{ env.REGISTRY }}/.*/frontend:.*|image: ${FRONTEND_IMAGE}|g" k8s/frontend.yaml

          git add k8s/backend.yaml k8s/frontend.yaml
          if ! git diff-index --quiet HEAD; then
            git commit -m "Update backend & frontend image version to ${SHORT_SHA}"
            git push
          else
            echo "No changes to commit"
          fi



